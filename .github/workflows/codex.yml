A progressive theme optimized and integrated with Gutenberg.

== Description ==
codex Theme is a lightweight yet full featured WordPress theme for creating beautiful fast loading and accessible websites, easier than ever. It features an easy to use drag and drop header and footer builder, extensive customization options, and compatibility with popular plugins.

== License ==
codex is released under GNU General Public License v3.0 (or later).

== Frequently Asked Questions ==
= Where do I report security bugs found in this theme? =
Please report security bugs found in the source code of the codex Theme through the [Patchstack Vulnerability Disclosure Program](https://patchstack.com/database/vdp/codex). The Patchstack team will assist you in resolving the issue.

== Security Policy ==
= Reporting Security Bugs =
Please report security bugs found in the codex theme's source code through the Patchstack Vulnerability Disclosure Program: https://patchstack.com/database/vdp/codex. The Patchstack team will assist you in resolving the issue.

== Changelog ==

== 1.0.0 | 1st November 2020 ==
* Initial release of the codex theme.
* Features:
  * Translation-ready
  * Two-column layout support
  * Right and left sidebar options
  * Footer widgets
  * Blog support
  * Custom logo and background
  * Custom menu support
  * RTL language support
  * Editor style
  * Threaded comments
  * Custom colors
  * Featured images
  * Wide blocks and full-width template support
  * Theme options for extensive customization
  * E-commerce compatibility
  * Drag and drop header and footer builder
  * Optimized for fast loading and accessibility
